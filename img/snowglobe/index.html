<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Single Snowman — A-Frame</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene renderer="antialias:true; colorManagement:true" loading-screen="enabled:false">
      <a-sky color="#6fb7ff"></a-sky>

      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; intensity: 0.9" position="2 4 3"></a-entity>

      <a-plane position="0 0 -3" rotation="-90 0 0" width="20" height="20" color="#ffffff"></a-plane>

      <a-entity position="0 0 -3">
        <a-sphere position="0 0.9 0" radius="0.9" color="#f9fdff"></a-sphere>
        <a-sphere position="0 1.75 0" radius="0.6" color="#f9fdff"></a-sphere>
        <a-sphere position="0 2.35 0" radius="0.42" color="#f9fdff"></a-sphere>

        <a-sphere position="-0.10 2.42 0.34" radius="0.035" color="#222"></a-sphere>
        <a-sphere position="0.10 2.42 0.34" radius="0.035" color="#222"></a-sphere>

        <a-cone position="0 2.36 0.45" radius-bottom="0.05" radius-top="0.005" height="0.22" color="#ff7f2a" rotation="-90 0 0"></a-cone>

        <a-sphere position="0 1.95 0.41" radius="0.03" color="#222"></a-sphere>
        <a-sphere position="0 1.70 0.43" radius="0.03" color="#222"></a-sphere>
        <a-sphere position="0 1.45 0.44" radius="0.03" color="#222"></a-sphere>

        <a-cylinder position="-0.75 1.75 0" radius="0.02" height="1.0" rotation="0 0 30" color="#6e4a2e"></a-cylinder>
        <a-cylinder position="0.75 1.75 0" radius="0.02" height="1.0" rotation="0 0 -30" color="#6e4a2e"></a-cylinder>

        <a-cylinder position="0 2.62 0" radius="0.14" height="0.18" color="#111"></a-cylinder>
        <a-torus position="0 2.54 0" radius="0.22" radius-tubular="0.035" color="#111"></a-torus>
      </a-entity>

      <a-entity position="0 1.6 0">
        <a-camera wasd-controls-enabled="false"></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
